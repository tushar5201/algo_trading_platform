events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Only send "Connection: upgrade" when the client actually asked for a WebSocket upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend  { server backend:3000; }
    upstream frontend { server frontend:80; }

    client_max_body_size 1m;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # React app (SPA fallback handled by the frontend container)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append) so a client-supplied X-Forwarded-For cannot spoof its IP
            # to the rate limiters; the backend trusts exactly one proxy hop.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

  frontend:
     build:
       dockerfile: Dockerfile.dev
     ports:
       - "5173:5173"
     volumes:
       - ./frontend/src:/app/src
  
  backend:
    build: 
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    environment:
      - NODE_ENV=development

  python-engine:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./python-engine/src:/app/src
    environment:
      - LOG_LEVEL=DEBUG

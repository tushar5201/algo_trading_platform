version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      # - frontend
    networks:
      - trading-net
  
  frontend:
     build:
       context: ./frontend
       dockerfile: Dockerfile
     volumes:
       - frontend_build:/app/dist
     networks:
       - trading-net
  
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - trading-net
  
  python-engine:
    build: 
      context: ./python-engine
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - mongodb
      - redis
    networks:
      - trading-net
    restart: unless-stopped
  
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - trading-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  frontend_build:

networks:
  trading-net:
    driver: bridge
